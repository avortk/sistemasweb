<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>PRACTICA EXAMEN</title>
    <link rel='stylesheet' href='estilo.css'>
</head>

<!-- esto es lo que usuario va a ver -->
<body>
    <header>
        <h1>Portal de Registro</h1>
    </header>

    <nav>
        <ul>
            <li><a href="#inicio">Inicio</a></li>
            <li><a href="#registro">Registro</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <article>
                <h2>Bienvenido a la nueva web</h2>
                <p>este sitio se hixo con el proposito de aprobaar</p>
            </article>
        </section>
        <p>llene los datos si quiere ser participe</p>

        <form class="formulario" action="#" method="post">
            <div class="formulario__datos">
                <label class="formulario__datos__label" for="name">name</label>
                <input class="formulario__datos__input"  type="text" id="name" required minlength="3">
            </div>

            <div class="formulario__datos">
                <label class="formulario__datos__label" for="email">email</label>
                <input class="formulario__datos__input" type="email" id="email" required>
            </div>

            <div class="formulario__datos">
                <input class="formulario__datos__input" type="submit" value="enviar">
            </div>
        </form>
        <img src="img/Miranda!+-+El+disco+de+tu+corazón,+Cover+art.jpeg" alt="album miranda">

    </main>


</body>
</html>
